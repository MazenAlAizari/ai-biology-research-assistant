name: Daily AI Biology Radar

on:
  schedule:
    - cron: '0 5 * * *' # يعمل يومياً الساعة 8:00 صباحاً بتوقيت مكة
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: فحص المستودع
        uses: actions/checkout@v4

      - name: تثبيت بايثون والمكتبات
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: تثبيت الحزم المطلوبة
        run: |
          pip install google-generativeai

      - name: تشغيل رادار الأبحاث
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_radar.py

      - name: حفظ وتحديث سجل الأبحاث والتقارير
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "تحديث تقرير الرادار اليومي [skip ci]" || exit 0
          git push
